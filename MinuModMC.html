<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuske Mc Mods</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('minuskepic.jpg') no-repeat center center fixed; /* */
            background-size: cover;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            image-rendering: pixelated;
        }

        header {
            text-align: center; padding: 25px;
            background: rgba(15, 15, 15, 0.98); width: 100%;
            border-bottom: 5px solid #333; position: sticky; top: 0; z-index: 1000;
        }

        h1 { font-size: 1.4rem; color: #ffff55; text-shadow: 3px 3px #000; margin-bottom: 20px; }

        #searchBar {
            width: 70%; max-width: 500px; padding: 12px;
            font-family: 'Press Start 2P', cursive; font-size: 0.7rem;
            background: #000; border: 3px solid #555; color: #55ff55; outline: none;
            text-align: center;
        }

        .mod-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px; width: 95%; padding: 40px 0;
        }

        .mod-card {
            background-color: #c6c6c6; border: 3px solid #000;
            box-shadow: inset -3px -3px 0px #555, inset 3px 3px 0px #fff;
            padding: 8px; text-align: center; cursor: pointer; color: #111;
            display: flex; flex-direction: column; align-items: center;
            aspect-ratio: 1/1; justify-content: center; transition: 0.05s;
        }

        .mod-card:hover { background-color: #fff; transform: scale(1.05); z-index: 10; }

        .mod-icon {
            width: 60px; height: 60px; margin-bottom: 8px;
            border: 2px solid #000; background: #222;
            object-fit: contain;
        }

        /* PIXEL ART BRIDGE ICON */
        .pixel-bridge {
            width: 80px; height: 40px; position: relative;
            background: #795548; box-shadow: 0 10px 0 #5d4037, -20px 0 0 #8d6e63, 20px 0 0 #8d6e63;
            margin-bottom: 20px;
        }
        .pixel-bridge::before {
            content: ""; position: absolute; top: -10px; left: -40px;
            width: 10px; height: 30px; background: #3e2723;
            box-shadow: 80px 0 0 #3e2723, 20px 0 0 #3e2723, 60px 0 0 #3e2723;
        }

        .featured {
            grid-column: 1 / -1; aspect-ratio: auto;
            background: #5555ff !important; color: white !important;
            border: 4px solid #ffff55 !important; padding: 20px;
            flex-direction: row; gap: 30px; margin-bottom: 20px;
        }

        .btn { background: #8b8b8b; border: 2px solid #000; padding: 5px; color: white; font-size: 0.4rem; margin-top: 8px; width: 90%; }
    </style>
</head>
<body>

<header>
    <h1>MINUSKE MC MODS</h1>
    <input type="text" id="searchBar" placeholder="SEARCH MODS" onkeyup="search()"> </header>

<div class="mod-grid" id="grid">
    <div class="mod-card featured" onclick="dl('http://www.mediafire.com/file/rb1jxmdvukal4tp/GodBridge-v1.0.jar/file')">
        <div class="pixel-bridge"></div> <div>
            <h3 style="font-size: 0.7rem;">⭐ GODBRIDGE V1.0 ⭐</h3>
            <p style="font-size: 0.4rem; margin: 5px 0;">INSTANT BRIDGING - MEDIAFIRE</p>
            <div class="btn">DOWNLOAD NOW</div>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');

    function dl(url) {
        // IMPROVED SUBSCRIPTION MESSAGE
        const message = "TO GET THIS MOD YOU NEED TO SUBSCRIBE TO @MINUSKE7!\n\nClick OK to visit the channel and unlock your download.";
        if(confirm(message)) {
            window.open("https://www.youtube.com/@Minuske7", "_blank");
            window.location.href = url;
        }
    }

    async function loadMods(query = '') {
        try {
            const url = query 
                ? `https://api.modrinth.com/v2/search?limit=100&query=${query}`
                : `https://api.modrinth.com/v2/search?limit=100&index=downloads`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            const featured = document.querySelector('.featured');
            grid.innerHTML = '';
            grid.appendChild(featured);

            data.hits.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'mod-card';
                card.onclick = () => dl(`https://modrinth.com/mod/${mod.slug}`);
                
                card.innerHTML = `
                    <img src="${mod.icon_url}" class="mod-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/606/606545.png'">
                    <h3 style="font-size: 0.35rem;">${mod.title}</h3>
                    <div class="btn">MODRINTH</div>
                `;
                grid.appendChild(card);
            });
        } catch (e) { 
            console.error("Modrinth API error"); 
        }
    }

    let timeout = null;
    function search() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            loadMods(document.getElementById('searchBar').value);
        }, 300);
    }

    window.onload = () => loadMods();
</script>

</body>
</html>
