<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuske Mc Mods</title>
    <link rel="icon" type="image/jpeg" href="icon4web.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('minuskepic.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            image-rendering: pixelated;
        }

        header {
            text-align: center; padding: 25px;
            background: rgba(15, 15, 15, 0.98); width: 100%;
            border-bottom: 5px solid #333; position: sticky; top: 0; z-index: 1000;
        }

        h1 { font-size: 1.4rem; color: #ffff55; text-shadow: 3px 3px #000; margin-bottom: 20px; }

        #searchBar {
            width: 70%; max-width: 500px; padding: 12px;
            font-family: 'Press Start 2P', cursive; font-size: 0.7rem;
            background: #000; border: 3px solid #555; color: #55ff55; outline: none;
            text-align: center;
        }

        .mod-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px; width: 95%; padding: 40px 0;
        }

        .mod-card {
            background-color: #c6c6c6; border: 3px solid #000;
            box-shadow: inset -3px -3px 0px #555, inset 3px 3px 0px #fff;
            padding: 8px; text-align: center; cursor: pointer; color: #111;
            display: flex; flex-direction: column; align-items: center;
            aspect-ratio: 1/1; justify-content: center; transition: 0.05s;
        }

        .mod-card:hover { background-color: #fff; transform: scale(1.05); z-index: 10; }

        .mod-icon {
            width: 60px; height: 60px; margin-bottom: 8px;
            border: 2px solid #000; background: #222;
            object-fit: cover;
        }

        .btn { background: #8b8b8b; border: 2px solid #000; padding: 5px; color: white; font-size: 0.35rem; margin-top: 8px; width: 90%; }
    </style>
</head>
<body>

<header>
    <h1>MINUSKE MC MODS</h1>
    <input type="text" id="searchBar" placeholder="SEARCH MODS" onkeyup="search()">
</header>

<div class="mod-grid" id="grid">
    </div>

<script>
    const grid = document.getElementById('grid');

    function dl(url) {
        const message = "TO GET THIS MOD YOU NEED TO SUBSCRIBE TO @MINUSKE7!\n\nClick OK to visit the channel and unlock your download.";
        if(confirm(message)) {
            window.open("https://www.youtube.com/@Minuske7", "_blank");
            window.location.href = url;
        }
    }

    async function loadMods(query = '') {
        try {
            const url = query 
                ? `https://api.modrinth.com/v2/search?limit=100&query=${query}`
                : `https://api.modrinth.com/v2/search?limit=100&index=downloads`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            grid.innerHTML = '';

            // ONLY show GodBridge if search is empty or if user specifically searches for it
            if (query === '' || "godbridge".includes(query.toLowerCase())) {
                const godCard = document.createElement('div');
                godCard.className = 'mod-card';
                godCard.onclick = () => dl('http://www.mediafire.com/file/rb1jxmdvukal4tp/GodBridge-v1.0.jar/file');
                godCard.innerHTML = `
                    <img src="godbridge_icon.jpg" class="mod-icon">
                    <h3 style="font-size: 0.35rem; margin: 0;">GODBRIDGE V1.0</h3>
                    <div class="btn">DOWNLOAD</div>
                `;
                grid.appendChild(godCard);
            }

            data.hits.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'mod-card';
                card.onclick = () => dl(`https://modrinth.com/mod/${mod.slug}`);
                
                card.innerHTML = `
                    <img src="${mod.icon_url}" class="mod-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/606/606545.png'">
                    <h3 style="font-size: 0.35rem; margin: 0;">${mod.title}</h3>
                    <div class="btn">MODRINTH</div>
                `;
                grid.appendChild(card);
            });
        } catch (e) { console.error("Error loading mods"); }
    }

    let timeout = null;
    function search() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            loadMods(document.getElementById('searchBar').value);
        }, 300);
    }

    window.onload = () => loadMods();
</script>

</body>
</html>
